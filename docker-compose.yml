# ============================================================
# docker-compose.yml - NOT NEEDED for XAMPP development
# ============================================================
# This project uses XAMPP's MySQL/MariaDB for the database
# and in-memory cache instead of Redis.
#
# To run the project:
#   1. Start XAMPP (Apache + MySQL)
#   2. Create database "zonadedamas" via phpMyAdmin
#   3. cd apps/api && npm run db:migrate
#   4. npm run db:seed
#   5. npm run dev
#
# If you want to use Docker instead of XAMPP in the future,
# uncomment the services below.
# ============================================================

